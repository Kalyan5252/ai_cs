<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Two Sum – Animated Teaching (With Explanation)</title>

    <style>
      body {
        background: #111;
        color: #fff;
        font-family: Arial, sans-serif;
        padding: 20px;
      }

      h2 {
        margin-bottom: 10px;
      }

      input {
        padding: 8px;
        font-size: 16px;
        margin-right: 10px;
        width: 220px;
      }

      button {
        padding: 10px 18px;
        font-size: 16px;
        margin-top: 10px;
        cursor: pointer;
      }

      .box-container {
        display: flex;
        gap: 20px;
        margin-top: 25px;
      }

      .box {
        width: 60px;
        height: 60px;
        background: #333;
        border: 2px solid #888;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        border-radius: 8px;
        transition: 0.4s;
      }

      .highlight {
        background: #ff4444;
        border-color: #ff8888;
      }

      #arrowRow {
        display: flex;
        gap: 20px;
        margin-top: 10px;
        height: 30px;
      }

      #info,
      #preprocess,
      #complexity {
        margin-top: 20px;
        font-size: 18px;
        line-height: 1.5;
      }

      #preprocess {
        color: #ffd369;
      }

      #complexity {
        color: #7ee787;
      }
    </style>
  </head>

  <body>
    <h2>Two Sum – Animated Teaching (Two Pointer Approach)</h2>

    <input id="arrayInput" placeholder="Array (e.g. 3,1,6,4,2)" />
    <input id="targetInput" placeholder="Target (e.g. 7)" />

    <br />
    <button id="toggleBtn">Start</button>

    <div id="preprocess"></div>

    <div class="box-container" id="boxes"></div>
    <div id="arrowRow"></div>

    <div id="info"></div>
    <div id="complexity"></div>

    <script>
      let arr = [];
      let left = 0;
      let right = 0;
      let target = 0;

      let running = false;
      let intervalId = null;

      const boxesDiv = document.getElementById('boxes');
      const arrowRow = document.getElementById('arrowRow');
      const info = document.getElementById('info');
      const preprocess = document.getElementById('preprocess');
      const complexity = document.getElementById('complexity');

      function render(l = -1, r = -1) {
        boxesDiv.innerHTML = '';
        arrowRow.innerHTML = '';

        arr.forEach((num, idx) => {
          const box = document.createElement('div');
          box.className = 'box';
          if (idx === l || idx === r) box.classList.add('highlight');
          box.textContent = num;
          boxesDiv.appendChild(box);

          const arrow = document.createElement('div');
          arrow.style.width = '60px';
          arrow.style.textAlign = 'center';
          arrow.style.fontSize = '22px';

          if (idx === l) arrow.textContent = '⬆ L';
          else if (idx === r) arrow.textContent = '⬆ R';
          else arrow.textContent = '';

          arrowRow.appendChild(arrow);
        });
      }

      function step() {
        if (left >= right) {
          info.textContent = '❌ No valid pair found';
          stop();
          return;
        }

        const sum = arr[left] + arr[right];
        render(left, right);

        info.textContent = `Checking: ${arr[left]} + ${arr[right]} = ${sum}`;

        if (sum === target) {
          info.textContent = `✅ Found Pair: ${arr[left]} + ${arr[right]} = ${target}`;
          stop();
        } else if (sum < target) {
          info.textContent += ' → Sum < Target → Move Left ➡';
          left++;
        } else {
          info.textContent += ' → Sum > Target → Move Right ⬅';
          right--;
        }
      }

      function stop() {
        clearInterval(intervalId);
        running = false;
        document.getElementById('toggleBtn').innerText = 'Start';
      }

      document.getElementById('toggleBtn').onclick = () => {
        running = !running;

        if (!running) {
          stop();
          return;
        }

        // Read user input
        const originalArr = document
          .getElementById('arrayInput')
          .value.split(',')
          .map(Number)
          .filter((n) => !isNaN(n));

        target = Number(document.getElementById('targetInput').value);

        if (originalArr.length < 2 || isNaN(target)) {
          alert('Please enter a valid array and target');
          running = false;
          return;
        }

        // Transparent sorting step
        arr = [...originalArr].sort((a, b) => a - b);

        preprocess.innerHTML = `
          <b>Preprocessing Step (Important):</b><br>
          Original Array: [${originalArr.join(', ')}]<br>
          Sorted Array Used: [${arr.join(', ')}]<br>
          <i>Two Pointer approach requires a sorted array</i>
        `;

        complexity.innerHTML = `
          <b>Time & Space Complexity:</b><br>
          Sorting: O(n log n)<br>
          Two Pointer Scan: O(n)<br>
          <b>Total Time:</b> O(n log n)<br>
          <b>Extra Space:</b> O(1)
        `;

        left = 0;
        right = arr.length - 1;

        document.getElementById('toggleBtn').innerText = 'Stop';
        info.textContent = `Target = ${target}`;
        render();
        intervalId = setInterval(step, 2000);
      };

      render();
    </script>
  </body>
</html>
