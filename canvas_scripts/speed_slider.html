<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Stock – Step Debugger with Speed</title>

    <style>
      body {
        background: #111;
        color: #fff;
        font-family: Arial;
        padding: 20px;
        display: flex;
        gap: 30px;
      }

      .left {
        flex: 1;
      }

      .right {
        width: 440px;
        background: #0d0d0d;
        border: 2px solid #333;
        border-radius: 10px;
        padding: 15px;
        font-family: Consolas, monospace;
        font-size: 15px;
      }

      .code-line {
        padding: 4px 6px;
        border-radius: 5px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .active {
        background: #2a5cff;
      }

      input[type='text'] {
        padding: 8px;
        font-size: 16px;
        width: 320px;
      }

      button {
        padding: 8px 14px;
        font-size: 15px;
        cursor: pointer;
      }

      .controls {
        margin-top: 10px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      .row {
        display: flex;
        gap: 12px;
        margin-top: 20px;
        align-items: flex-end;
      }

      .box {
        width: 55px;
        height: 55px;
        background: #333;
        border: 2px solid #888;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 22px;
        border-radius: 8px;
      }

      .highlight {
        background: #ff4444;
        border-color: #ff8888;
      }

      .min {
        background: #00c853;
        border-color: #7dffb0;
      }

      .bar {
        width: 55px;
        background: #555;
        border-radius: 6px 6px 0 0;
        border: 2px solid transparent;
      }

      .bar-current {
        background: #ff4444;
      }
      .bar-min {
        background: #00c853;
      }

      .info,
      .profit {
        margin-top: 15px;
        font-size: 18px;
      }

      .speed {
        font-size: 14px;
        opacity: 0.9;
      }
    </style>
  </head>

  <body>
    <!-- LEFT -->
    <div class="left">
      <h2>Best Time to Buy and Sell Stock</h2>
      <p>(Step Debugger + Speed Control)</p>

      <input
        id="pricesInput"
        type="text"
        placeholder="Prices (e.g. 7,1,5,3,6,4)"
      />

      <div class="controls">
        <button id="playPauseBtn">▶ Play</button>
        <button id="prevBtn">⏮ Prev</button>
        <button id="nextBtn">⏭ Next</button>
        <button id="resetBtn">⟲ Reset</button>

        <label class="speed">
          Speed:
          <input
            type="range"
            id="speedSlider"
            min="0.5"
            max="3"
            step="0.5"
            value="1"
          />
          <span id="speedValue">1×</span>
        </label>
      </div>

      <div class="info" id="info"></div>

      <div class="row" id="priceRow"></div>
      <div class="row" id="histogram"></div>

      <div class="profit" id="profitView"></div>
    </div>

    <!-- RIGHT -->
    <div class="right">
      <b>Python Code</b>
      <div class="code-line" id="p1">min_price = prices[0]</div>
      <div class="code-line" id="p2">max_profit = 0</div>
      <div class="code-line" id="p3">for price in prices:</div>
      <div class="code-line" id="p4">if price < min_price:</div>
      <div class="code-line" id="p5">min_price = price</div>
      <div class="code-line" id="p6">else:</div>
      <div class="code-line" id="p7">
        max_profit = max(max_profit, price - min_price)
      </div>
      <div class="code-line" id="p8">return max_profit</div>
    </div>

    <script>
      let prices = [];
      let states = [];
      let stepIndex = 0;

      let playing = false;
      let intervalId = null;
      let baseDelay = 1500; // ms
      let speed = 1;

      const priceRow = document.getElementById('priceRow');
      const histogram = document.getElementById('histogram');
      const info = document.getElementById('info');
      const profitView = document.getElementById('profitView');
      const playPauseBtn = document.getElementById('playPauseBtn');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');

      function highlightCode(id) {
        document
          .querySelectorAll('.code-line')
          .forEach((l) => l.classList.remove('active'));
        document.getElementById(id)?.classList.add('active');
      }

      function render(state) {
        priceRow.innerHTML = '';
        histogram.innerHTML = '';

        const maxVal = Math.max(...prices);

        prices.forEach((p, idx) => {
          const box = document.createElement('div');
          box.className = 'box';
          if (idx === state.i) box.classList.add('highlight');
          if (p === state.minPrice) box.classList.add('min');
          box.textContent = p;
          priceRow.appendChild(box);

          const bar = document.createElement('div');
          bar.className = 'bar';
          bar.style.height = `${(p / maxVal) * 120}px`;
          if (idx === state.i) bar.classList.add('bar-current');
          if (p === state.minPrice) bar.classList.add('bar-min');
          histogram.appendChild(bar);
        });

        profitView.textContent = `Max Profit So Far: ${state.maxProfit}`;
        info.textContent = state.info;
        highlightCode(state.code);
      }

      function computeStates() {
        states = [];
        let minPrice = prices[0];
        let maxProfit = 0;

        states.push({
          i: -1,
          minPrice,
          maxProfit,
          info: 'Initialization',
          code: 'p1',
        });

        prices.forEach((price, i) => {
          if (price < minPrice) {
            minPrice = price;
            states.push({
              i,
              minPrice,
              maxProfit,
              info: `New minimum → Buy at ${price}`,
              code: 'p5',
            });
          } else {
            maxProfit = Math.max(maxProfit, price - minPrice);
            states.push({
              i,
              minPrice,
              maxProfit,
              info: `Sell at ${price}`,
              code: 'p7',
            });
          }
        });

        states.push({
          i: prices.length,
          minPrice,
          maxProfit,
          info: 'Traversal completed',
          code: 'p8',
        });
      }

      function play() {
        intervalId = setInterval(() => {
          if (stepIndex >= states.length - 1) return pause();
          stepIndex++;
          render(states[stepIndex]);
        }, baseDelay / speed);

        playing = true;
        playPauseBtn.textContent = '⏸ Pause';
      }

      function pause() {
        clearInterval(intervalId);
        playing = false;
        playPauseBtn.textContent = '▶ Resume';
      }

      /* Controls */
      document.getElementById('nextBtn').onclick = () => {
        pause();
        if (stepIndex < states.length - 1) {
          stepIndex++;
          render(states[stepIndex]);
        }
      };

      document.getElementById('prevBtn').onclick = () => {
        pause();
        if (stepIndex > 0) {
          stepIndex--;
          render(states[stepIndex]);
        }
      };

      document.getElementById('resetBtn').onclick = () => {
        pause();
        stepIndex = 0;
        render(states[0]);
        playPauseBtn.textContent = '▶ Play';
      };

      playPauseBtn.onclick = () => {
        if (!prices.length) {
          prices = pricesInput.value
            .split(',')
            .map(Number)
            .filter((n) => !isNaN(n));

          if (prices.length < 2) {
            alert('Enter at least two prices');
            return;
          }

          computeStates();
          stepIndex = 0;
          render(states[0]);
        }

        playing ? pause() : play();
      };

      /* Speed slider */
      speedSlider.oninput = () => {
        speed = Number(speedSlider.value);
        speedValue.textContent = speed + '×';

        if (playing) {
          pause();
          play(); // restart interval with new speed
        }
      };
    </script>
  </body>
</html>
