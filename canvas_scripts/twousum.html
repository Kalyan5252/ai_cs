<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Two Sum – Animated Teaching</title>
    <style>
      body {
        background: #111;
        color: #fff;
        font-family: Arial;
        padding: 20px;
      }

      .box-container {
        display: flex;
        gap: 20px;
        margin-top: 20px;
      }

      .box {
        width: 60px;
        height: 60px;
        background: #333;
        border: 2px solid #888;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        border-radius: 8px;
        transition: 0.4s;
      }

      .highlight {
        background: #ff4444 !important;
        border-color: #ff8888 !important;
      }

      #arrowRow {
        display: flex;
        gap: 20px;
        margin-top: 10px;
        height: 30px;
      }

      #info {
        margin-top: 20px;
        font-size: 20px;
      }

      button {
        padding: 10px 16px;
        font-size: 16px;
        margin-bottom: 10px;
      }
    </style>
  </head>

  <body>
    <button id="toggleBtn">Start</button>

    <div class="box-container" id="boxes"></div>
    <div id="arrowRow"></div>

    <div id="info">Target: 10</div>

    <script>
      let arr = [1, 2, 4, 6, 8];
      let target = 10;

      let left = 0;
      let right = arr.length - 1;

      let running = false;
      let intervalId = null;

      const boxesDiv = document.getElementById('boxes');
      const arrowRow = document.getElementById('arrowRow');
      const info = document.getElementById('info');

      function render(highL = -1, highR = -1) {
        boxesDiv.innerHTML = '';
        arrowRow.innerHTML = '';

        arr.forEach((num, idx) => {
          const box = document.createElement('div');
          box.className = 'box';

          if (idx === highL || idx === highR) {
            box.classList.add('highlight');
          }

          box.textContent = num;
          boxesDiv.appendChild(box);

          const arrow = document.createElement('div');
          arrow.style.width = '60px';
          arrow.style.textAlign = 'center';
          arrow.style.fontSize = '22px';

          if (idx === highL) arrow.textContent = '⬆ L';
          else if (idx === highR) arrow.textContent = '⬆ R';
          else arrow.textContent = '';

          arrowRow.appendChild(arrow);
        });
      }

      function step() {
        if (left >= right) {
          info.textContent = 'No pair found ❌';
          stop();
          return;
        }

        let sum = arr[left] + arr[right];

        render(left, right);
        info.textContent = `Checking: ${arr[left]} + ${arr[right]} = ${sum}`;

        if (sum === target) {
          info.textContent = `Found ✔ ${arr[left]} + ${arr[right]} = ${target}`;
          stop();
        } else if (sum < target) {
          info.textContent += ' → Sum < Target → Move Left ➡';
          left++;
        } else {
          info.textContent += ' → Sum > Target → Move Right ⬅';
          right--;
        }
      }

      function stop() {
        clearInterval(intervalId);
        running = false;
        document.getElementById('toggleBtn').innerText = 'Start';
      }

      document.getElementById('toggleBtn').onclick = () => {
        running = !running;

        if (running) {
          document.getElementById('toggleBtn').innerText = 'Stop';
          left = 0;
          right = arr.length - 1;
          render();
          intervalId = setInterval(step, 2000);
        } else {
          stop();
        }
      };

      render();
    </script>
  </body>
</html>
