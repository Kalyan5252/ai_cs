<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Two Sum – User Input Animation</title>

    <style>
      body {
        background: #111;
        color: #fff;
        font-family: Arial;
        padding: 20px;
      }

      input {
        padding: 8px;
        font-size: 16px;
        margin-right: 10px;
        width: 200px;
      }

      button {
        padding: 10px 16px;
        font-size: 16px;
        margin-top: 10px;
      }

      .box-container {
        display: flex;
        gap: 20px;
        margin-top: 20px;
      }

      .box {
        width: 60px;
        height: 60px;
        background: #333;
        border: 2px solid #888;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        border-radius: 8px;
        transition: 0.4s;
      }

      .highlight {
        background: #ff4444;
        border-color: #ff8888;
      }

      #arrowRow {
        display: flex;
        gap: 20px;
        margin-top: 10px;
        height: 30px;
      }

      #info {
        margin-top: 20px;
        font-size: 20px;
      }
    </style>
  </head>

  <body>
    <h2>Two Sum – Animated Teaching</h2>

    <input id="arrayInput" placeholder="Array: 1,2,4,6,8" />
    <input id="targetInput" placeholder="Target: 10" />

    <br /><br />
    <button id="toggleBtn">Start</button>

    <div class="box-container" id="boxes"></div>
    <div id="arrowRow"></div>
    <div id="info"></div>

    <script>
      let arr = [];
      let target = 0;
      let left = 0;
      let right = 0;

      let running = false;
      let intervalId = null;

      const boxesDiv = document.getElementById('boxes');
      const arrowRow = document.getElementById('arrowRow');
      const info = document.getElementById('info');

      function render(l = -1, r = -1) {
        boxesDiv.innerHTML = '';
        arrowRow.innerHTML = '';

        arr.forEach((num, idx) => {
          const box = document.createElement('div');
          box.className = 'box';
          if (idx === l || idx === r) box.classList.add('highlight');
          box.textContent = num;
          boxesDiv.appendChild(box);

          const arrow = document.createElement('div');
          arrow.style.width = '60px';
          arrow.style.textAlign = 'center';
          arrow.style.fontSize = '22px';

          if (idx === l) arrow.textContent = '⬆ L';
          else if (idx === r) arrow.textContent = '⬆ R';
          else arrow.textContent = '';

          arrowRow.appendChild(arrow);
        });
      }

      function step() {
        if (left >= right) {
          info.textContent = 'No valid pair found ❌';
          stop();
          return;
        }

        const sum = arr[left] + arr[right];
        render(left, right);

        info.textContent = `Checking ${arr[left]} + ${arr[right]} = ${sum}`;

        if (sum === target) {
          info.textContent = `✔ Found Pair: ${arr[left]} + ${arr[right]} = ${target}`;
          stop();
        } else if (sum < target) {
          info.textContent += ' → Sum < Target → Move Left ➡';
          left++;
        } else {
          info.textContent += ' → Sum > Target → Move Right ⬅';
          right--;
        }
      }

      function stop() {
        clearInterval(intervalId);
        running = false;
        document.getElementById('toggleBtn').innerText = 'Start';
      }

      document.getElementById('toggleBtn').onclick = () => {
        running = !running;

        if (running) {
          // Read user input
          arr = document
            .getElementById('arrayInput')
            .value.split(',')
            .map(Number)
            .filter((n) => !isNaN(n));

          target = Number(document.getElementById('targetInput').value);

          if (arr.length < 2 || isNaN(target)) {
            alert('Please enter valid array and target');
            running = false;
            return;
          }

          // Sort array (required for two pointers)
          arr.sort((a, b) => a - b);

          left = 0;
          right = arr.length - 1;

          document.getElementById('toggleBtn').innerText = 'Stop';
          render();
          info.textContent = `Target = ${target}`;
          intervalId = setInterval(step, 2000);
        } else {
          stop();
        }
      };

      render();
    </script>
  </body>
</html>
