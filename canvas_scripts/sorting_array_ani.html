<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Sorting Animation – Step Explanation</title>
    <style>
      body {
        background: #111;
        color: #fff;
        font-family: Arial;
        padding: 20px;
      }
      .box-container {
        display: flex;
        gap: 20px;
        margin-top: 20px;
      }
      .box {
        width: 60px;
        height: 60px;
        background: #333;
        border: 2px solid #888;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        border-radius: 8px;
        transition: 0.4s;
      }
      .highlight {
        background: #ff4444 !important;
        border-color: #ff8888 !important;
      }
      #iterationBox {
        margin-top: 20px;
        font-size: 20px;
      }
      button {
        padding: 10px 16px;
        font-size: 16px;
        margin-top: 10px;
      }
      #arrowRow div {
        transition: transform 0.25s;
      }
    </style>
  </head>
  <body>
    <button id="toggleBtn">Start</button>

    <div class="box-container" id="boxes"></div>
    <div
      id="arrowRow"
      style="display: flex; gap: 20px; margin-top: 10px; height: 30px"
    ></div>
    <div id="iterationBox">Iteration: 0</div>

    <script>
      // Fixed version: removed the accidental duplicate/broken renderBoxes definition

      let arr = [1, 2, 5, 4, 6];
      let i = 0,
        j = 0;
      let running = false;
      let intervalId = null;

      const boxesDiv = document.getElementById('boxes');
      const iterationEl = document.getElementById('iterationBox');
      const arrowRow = document.getElementById('arrowRow');

      function renderBoxes(highA = -1, highB = -1) {
        // Render boxes and arrows beneath them. Single correct definition.
        boxesDiv.innerHTML = '';
        arrowRow.innerHTML = '';

        arr.forEach((num, idx) => {
          const div = document.createElement('div');
          div.className = 'box';
          if (idx === highA || idx === highB) div.classList.add('highlight');
          div.textContent = num;
          boxesDiv.appendChild(div);

          // arrow placeholder underneath each box
          const arrow = document.createElement('div');
          arrow.style.width = '60px';
          arrow.style.height = '30px';
          arrow.style.display = 'flex';
          arrow.style.justifyContent = 'center';
          arrow.style.alignItems = 'center';
          arrow.style.fontSize = '22px';

          if (idx === highA || idx === highB) {
            arrow.textContent = '⬆';
          } else {
            arrow.textContent = '';
          }

          arrowRow.appendChild(arrow);
        });
      }

      function step() {
        if (i >= arr.length - 1) {
          clearInterval(intervalId);
          running = false;
          document.getElementById('toggleBtn').innerText = 'Start';
          iterationEl.textContent = `Iteration: completed`;
          renderBoxes();
          return;
        }

        iterationEl.textContent = `Iteration: i=${i}, j=${j}`;

        // Selection-sort style comparison: j runs from i+1 → n-1
        if (j < arr.length) {
          renderBoxes(i, j);

          if (arr[i] > arr[j]) {
            let temp = arr[i];
            arr[i] = arr[j];
            arr[j] = temp;
          }
          j++;
        } else {
          i++;
          j = i + 1;
        }
      }

      document.getElementById('toggleBtn').onclick = () => {
        running = !running;

        if (running) {
          document.getElementById('toggleBtn').innerText = 'Stop';
          i = 0;
          j = 0;
          arr = [1, 2, 5, 4, 6];
          renderBoxes();

          intervalId = setInterval(step, 2000); // 2 seconds per iteration
        } else {
          document.getElementById('toggleBtn').innerText = 'Start';
          clearInterval(intervalId);
        }
      };

      // initial render
      renderBoxes();
    </script>
  </body>
</html>
